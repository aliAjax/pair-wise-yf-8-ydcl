<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>胶片分镜条核对台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">纸质放映胶片整理</p>
          <h1>胶片分镜条核对台</h1>
        </div>
        <div class="hero-stats">
          <div>
            <span>总时长</span>
            <strong id="totalDuration">0:00</strong>
          </div>
          <div>
            <span>破损片段</span>
            <strong id="damageCount">0</strong>
          </div>
          <div>
            <span>片段数</span>
            <strong id="segmentCount">0</strong>
          </div>
        </div>
      </header>

      <section class="toolbar">
        <label>
          胶片卷
          <input id="reelTitle" type="text" placeholder="例：春日试映A卷" />
        </label>
        <label>
          颜色偏移
          <select id="colorFilter">
            <option value="all">全部</option>
            <option value="正常">正常</option>
            <option value="偏红">偏红</option>
            <option value="偏青">偏青</option>
            <option value="偏黄">偏黄</option>
            <option value="褪色">褪色</option>
          </select>
        </label>
        <label>
          搜索
          <input id="searchInput" type="search" placeholder="片段编号或备注" />
        </label>
        <button id="exportBtn">导出清单</button>
      </section>

      <section class="panel screening-panel" id="screeningPanel" aria-label="现场放映计时区">
        <div class="screening-head">
          <div>
            <h2>现场放映计时</h2>
            <p class="screening-hint">开始后按片段剩余秒数倒计时；可暂停续放、临时跳过，进度自动保存在本机，重开页面不丢。</p>
          </div>
          <span class="screening-status status-idle" id="screeningStatus">未开始</span>
        </div>

        <div class="screening-now">
          <div class="now-meta">
            <span class="now-label">正在放映</span>
            <strong id="nowCode">准备就绪</strong>
            <p class="now-note" id="nowNote"></p>
          </div>
          <div class="now-clock">
            <strong id="nowRemaining">0:00</strong>
            <span>本段剩余（计划 <em id="nowPlanned">0:00</em>）</span>
          </div>
        </div>
        <div class="now-progress"><div id="nowProgressBar"></div></div>

        <div class="screening-controls">
          <button id="startBtn" class="primary" type="button">开始放映</button>
          <button id="pauseBtn" class="hidden" type="button">暂停</button>
          <button id="resumeBtn" class="primary hidden" type="button">继续放映</button>
          <button id="skipBtn" class="hidden" type="button">跳过本段（留下已映秒数）</button>
          <button id="resetBtn" class="ghost hidden" type="button">重新放映</button>
        </div>

        <div class="screening-stats">
          <div>
            <span>计划时长</span>
            <strong id="planTotal">0:00</strong>
          </div>
          <div>
            <span>实际放映</span>
            <strong id="actualTotal">0:00</strong>
          </div>
          <div>
            <span>放映进度</span>
            <strong id="progressText">0/0</strong>
          </div>
          <div>
            <span>跳过片段</span>
            <strong id="skipCount">0</strong>
          </div>
        </div>

        <div id="screeningSummary" class="screening-summary hidden"></div>
      </section>

      <section class="layout">
        <aside class="panel">
          <h2>录入片段</h2>
          <form id="segmentForm" class="segment-form">
            <label>
              片段编号
              <input id="codeInput" required placeholder="A-014" />
            </label>
            <label>
              时长秒数
              <input id="durationInput" required type="number" min="1" value="12" />
            </label>
            <label>
              颜色偏移
              <select id="shiftInput">
                <option value="正常">正常</option>
                <option value="偏红">偏红</option>
                <option value="偏青">偏青</option>
                <option value="偏黄">偏黄</option>
                <option value="褪色">褪色</option>
              </select>
            </label>
            <label>
              破损情况
              <select id="damageInput">
                <option value="完好">完好</option>
                <option value="轻微划痕">轻微划痕</option>
                <option value="齿孔破损">齿孔破损</option>
                <option value="接片松动">接片松动</option>
                <option value="需跳过">需跳过</option>
              </select>
            </label>
            <label>
              缩略图
              <input id="thumbInput" type="file" accept="image/*" />
            </label>
            <label>
              备注
              <textarea id="noteInput" rows="4" placeholder="试映前要留意的画面、接片或声音点"></textarea>
            </label>
            <button class="primary" type="submit">加入放映清单</button>
          </form>
        </aside>

        <section class="panel list-panel">
          <div class="panel-head">
            <h2>放映顺序</h2>
            <span>拖拽片段调整顺序</span>
          </div>
          <div id="segmentList" class="segment-list"></div>
        </section>

        <aside class="panel warning-panel">
          <h2>试映前核对</h2>
          <div id="warningList" class="warning-list"></div>
        </aside>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
